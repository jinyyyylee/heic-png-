[package]
name = "tauri-app"
version = "1.0.0"
description = "HEIC 이미지 변환기 - HEIC/HEIF 파일을 JPG/PNG로 변환하는 안전한 도구"
authors = ["you"]
edition = "2021"
license = "MIT"
repository = ""
keywords = ["heic", "heif", "image", "converter"]
categories = ["multimedia", "graphics"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
# 보안 및 성능 최적화
opt-level = "z"      # 코드 크기 최소화 (보안: 작은 공격면)
lto = true           # Link Time Optimization (성능 최적화)
codegen-units = 1    # 더 나은 최적화
strip = true         # 디버그 심볼 제거 (보안: 역공학 어려움)
panic = "abort"      # 패닉 시 즉시 종료 (보안: 스택 오버플로우 방지)

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
libheif-rs = "2.5"
base64 = "0.22"

